<!DOCTYPE html>
<html>
<head>
    <title>Growth.exe</title>
    <link rel="stylesheet" href="2main.css">
    <link rel="icon" type="image/gif" href="mushroom8.gif">
    <link rel="stylesheet" href="https://use.typekit.net/vnc5qjy.css">
</head>
<body>
    <h1>Decorate your garden</h1>
    <p>Song by Matthew Stoeter</p>

    <div class="container">
        <!-- Left side tabs and buttons -->
        <div class="tabs-container">
            <div class="tab-buttons-top">
    <button id="undoBtn" class="icon-btn">
    <img src="undo.png" alt="Undo">
                <button id="restartBtn" class="icon-btn">
                   <img src="trash.png" alt="Restart">
</button>
            </div>

            <div class="tabs">
                <div class="tab side-panel" id="tab1">
                    <h3>Tab 1</h3>
                    <img src="img1.png" draggable="true">
                    <img src="img2.png" draggable="true">
                    <img src="img3.png" draggable="true">
                    <img src="img4.png" draggable="true">
                    <img src="img5.png" draggable="true">
                    <img src="img6.png" draggable="true">
                    <img src="img7.png" draggable="true">
                    <img src="img8.png" draggable="true">
                    <img src="img9.png" draggable="true">
                    <img src="img10.png" draggable="true">
                    <img src="img11.png" draggable="true">
                    <img src="img12.png" draggable="true">
                    <img src="img13.png" draggable="true">
                    <img src="img14.png" draggable="true">
                    <img src="img15.png" draggable="true">
                </div>
                <div class="tab side-panel" id="tab2">
                    <h3>Tab 2</h3>
                    <img src="img16.png" draggable="true">
                    <img src="img17.png" draggable="true">
                    <img src="img18.png" draggable="true">
                    <img src="img19.png" draggable="true">
                    <img src="img20.png" draggable="true">
                    <img src="img21.png" draggable="true">
                    <img src="img22.png" draggable="true">
                    <img src="img23.png" draggable="true">
                    <img src="img24.png" draggable="true">
                    <img src="img25.png" draggable="true">
                    <img src="img26.png" draggable="true">
                    <img src="img27.png" draggable="true">
                    <img src="img28.png" draggable="true">
                    <img src="img29.png" draggable="true">
                </div>
            </div>
        </div>

        <!-- Central image box -->
        <div class="image-box" id="imageBox">
            <button id="bgChangeBtn">Change Background</button>
        </div>
    </div>

    <!-- Background music -->
    <audio id="bgMusic" src="VGM.mp3" loop></audio>

    <!-- Music control button (image) -->
    <button id="musicBtn">
        <img src="music.png" alt="Music Button">
    </button>

    <!-- JS -->
    <script src="2script.js"></script>
</body>
</html>
